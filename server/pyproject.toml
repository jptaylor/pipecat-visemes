[project]
name = "pipecat-visemes"
version = "0.1.0"
description = "Standalone example: server-side lipsync (viseme) analysis for Pipecat voice bots"
requires-python = ">=3.11"
dependencies = [
    # Extras match the official `pipecat init quickstart` scaffold (SmallWebRTC/Daily
    # transports, Deepgram STT, OpenAI LLM, Cartesia TTS), plus `cli` for the
    # `pipecat` command. The lipsync package itself needs only numpy and soxr,
    # both pipecat core dependencies. Pinned to the release line this example
    # is verified against.
    "pipecat-ai[cartesia,cli,daily,deepgram,openai,runner,silero,webrtc]~=1.5.0",
    "numpy>=1.26",       # imported directly by lipsync/
    "python-dotenv>=1",  # imported directly by bot.py and benchmarks/
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.15.14",
    # Accuracy benchmark harness (benchmarks/accuracy.py): Praat reference
    # tracks and the corpus file. Harness-only.
    "praat-parselmouth>=0.4",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lipsync", "benchmarks", "tests"]
